apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp-deployment
  namespace: architecturehpa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
      - name: scaletestapp
        image: ghcr.io/yandex-practicum/scaletestapp:latest@sha256:7273dd1ffd1c1a29a307eb299b949f71828952b90dee42a5b26b052e92793452
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080 
        resources:
          requests:           
            memory: "20Mi"
            cpu: "50m"
          limits:           
            memory: "20Mi"
            cpu: "50m"